apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: libreplay-public-cloudflare-only
  namespace: libreplay
  labels:
    app.kubernetes.io/name: libreplay
    app.kubernetes.io/component: public-edge
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: libreplay-public
  namespace: libreplay
  labels:
    app.kubernetes.io/name: libreplay
    app.kubernetes.io/component: public-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: libreplay.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    agentgateway.e-dani.com/exemption: human-web-edge-only-no-new-agent-api
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - match: Host(`libreplay.e-dani.com`)
      kind: Rule
      priority: 300
      middlewares:
        - name: libreplay-public-cloudflare-only
      services:
        - name: libreplay-web
          port: 80
  tls:
    store: { name: default, namespace: traefik-edge }
