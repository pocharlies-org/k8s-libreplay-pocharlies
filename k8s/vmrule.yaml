apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: libreplay-runtime
  namespace: monitoring
  labels:
    app.kubernetes.io/name: libreplay
    app.kubernetes.io/part-of: libreplay
spec:
  groups:
    - name: libreplay.runtime
      interval: 30s
      rules:
        - alert: LibrePlayMetricsScrapeMissing
          expr: |
            (up{namespace="libreplay",job="libreplay-web"} == 0)
            or
            absent(up{namespace="libreplay",job="libreplay-web"})
          for: 2m
          labels:
            severity: critical
            area: observability
            app: libreplay
          annotations:
            summary: "LibrePlay metrics scrape is missing"
            description: "VictoriaMetrics has not scraped libreplay-web metrics for more than 2 minutes. Check VMServiceScrape/libreplay-web, Service labels and /api/metrics."
        - alert: LibrePlayDeploymentUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="libreplay",deployment=~"libreplay-web|libreplay-worker"}
              >
            kube_deployment_status_replicas_available{namespace="libreplay",deployment=~"libreplay-web|libreplay-worker"}
          for: 5m
          labels:
            severity: critical
            area: availability
            app: libreplay
          annotations:
            summary: "LibrePlay deployment {{ $labels.deployment }} is unavailable"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired for more than 5 minutes."
        - alert: LibrePlayPostgresUnavailable
          expr: |
            kube_statefulset_replicas{namespace="libreplay",statefulset="libreplay-postgres"}
              >
            kube_statefulset_status_replicas_ready{namespace="libreplay",statefulset="libreplay-postgres"}
          for: 5m
          labels:
            severity: critical
            area: database
            app: libreplay
          annotations:
            summary: "LibrePlay Postgres StatefulSet is unavailable"
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired for more than 5 minutes."
        - alert: LibrePlayDependencyDown
          expr: min by (dependency) (libreplay_dependency_up{namespace="libreplay",service="libreplay-web"}) < 1
          for: 2m
          labels:
            severity: critical
            area: dependency
            app: libreplay
          annotations:
            summary: "LibrePlay dependency {{ $labels.dependency }} is down"
            description: "The /api/health/deps runtime check reports {{ $labels.dependency }} as unavailable for more than 2 minutes."
        - alert: LibrePlayDependencyLatencyHigh
          expr: max by (dependency) (libreplay_dependency_latency_ms{namespace="libreplay",service="libreplay-web"}) > 2000
          for: 10m
          labels:
            severity: warning
            area: dependency
            app: libreplay
          annotations:
            summary: "LibrePlay dependency {{ $labels.dependency }} latency is high"
            description: "The /api/health/deps runtime check for {{ $labels.dependency }} has stayed above 2000 ms for more than 10 minutes."
        - alert: LibrePlayQueueFailures
          expr: sum by (queue) (libreplay_queue_jobs{namespace="libreplay",service="libreplay-web",state="failed"}) > 0
          for: 5m
          labels:
            severity: warning
            area: queues
            app: libreplay
          annotations:
            summary: "LibrePlay queue {{ $labels.queue }} has failed jobs"
            description: "BullMQ queue {{ $labels.queue }} has failed jobs for more than 5 minutes. Check worker logs and retry/dead-letter policy."
        - alert: LibrePlayQueueBacklogHigh
          expr: sum by (queue) (libreplay_queue_jobs{namespace="libreplay",service="libreplay-web",state=~"waiting|delayed"}) > 25
          for: 15m
          labels:
            severity: warning
            area: queues
            app: libreplay
          annotations:
            summary: "LibrePlay queue {{ $labels.queue }} backlog is high"
            description: "BullMQ queue {{ $labels.queue }} has more than 25 waiting or delayed jobs for more than 15 minutes."
        - alert: LibrePlayWorkerOrWebRestarting
          expr: sum by (container) (increase(kube_pod_container_status_restarts_total{namespace="libreplay",container=~"libreplay-web|libreplay-worker"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
            area: kubernetes
            app: libreplay
          annotations:
            summary: "LibrePlay {{ $labels.container }} restarted"
            description: "Container {{ $labels.container }} restarted in the last 15 minutes and remained a signal for 5 minutes. Check pod events and logs."
    - name: libreplay.synthetics
      interval: 30s
      rules:
        - alert: LibrePlaySyntheticDown
          expr: probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"} == 0
          for: 3m
          labels:
            severity: critical
            area: synthetics
            app: libreplay
          annotations:
            summary: "LibrePlay LAN synthetic health probe is failing"
            description: "The blackbox probe for {{ $labels.instance }} has failed for more than 3 minutes. Check Traefik LAN routing, TLS and /api/health."
        - alert: LibrePlaySyntheticLatencyHigh
          expr: probe_duration_seconds{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"} > 2
          for: 10m
          labels:
            severity: warning
            area: synthetics
            app: libreplay
          annotations:
            summary: "LibrePlay LAN synthetic probe latency is high"
            description: "The blackbox probe for {{ $labels.instance }} has stayed above 2 seconds for more than 10 minutes."
        - alert: LibrePlaySyntheticAvailabilityBudgetLow
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[1h]) < 0.99
          for: 5m
          labels:
            severity: warning
            area: slo
            app: libreplay
          annotations:
            summary: "LibrePlay LAN synthetic availability budget is low"
            description: "The 1-hour availability proxy for {{ $labels.instance }} is below 99%. This is a 1h supplement/proxy only; the canonical multi-window multi-burn-rate error-budget SLO policy lives in the libreplay.slo group. LAN-only SLI; routes today to the shared Synapse receiver (visibility), not a dedicated LibrePlay pager."
    # Canonical SLO policy for the LibrePlay LAN synthetic availability SLI.
    # Target: 99.0% availability over a rolling 14d window (LAN-only; NOT a public
    # edge SLO). 14d is bounded by VMSingle retentionPeriod=15d and matches Loki
    # retention (336h). The SLI is a single blackbox health probe against
    # https://libreplay.lan.e-dani.com/api/health; do not over-claim public/edge
    # coverage. Burn-rate windows are all <= 3d so they evaluate within retention;
    # only error_budget_remaining_ratio (14d) depends on accrued history.
    - name: libreplay.slo
      interval: 30s
      rules:
        - record: libreplay:slo_synth_avail:ratio5m
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[5m])
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - record: libreplay:slo_synth_avail:ratio30m
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[30m])
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - record: libreplay:slo_synth_avail:ratio1h
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[1h])
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - record: libreplay:slo_synth_avail:ratio6h
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[6h])
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - record: libreplay:slo_synth_avail:ratio3d
          expr: avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[3d])
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - record: libreplay:slo_synth_avail:error_budget_remaining_ratio
          expr: clamp_min(1 - ((1 - avg_over_time(probe_success{job="libreplay-lan-synthetic",app="libreplay",endpoint="health"}[14d])) / (1 - 0.99)), 0)
          labels:
            app: libreplay
            area: slo
            slo: synthetic-availability
        - alert: LibrePlaySLOErrorBudgetBurnFast
          expr: |
            libreplay:slo_synth_avail:ratio1h < 0.856
            and
            libreplay:slo_synth_avail:ratio5m < 0.856
          for: 2m
          labels:
            severity: critical
            area: slo
            app: libreplay
            slo: synthetic-availability
            burnrate: fast
          annotations:
            summary: "LibrePlay SLO fast error-budget burn (LAN synthetic availability)"
            description: "Fast burn (1h and 5m availability both < 0.856, ~14.4x the 99% budget) for the LAN synthetic SLI. SLI is LAN-only (https://libreplay.lan.e-dani.com/api/health), not a public/edge signal. This alert routes today to the shared Synapse Alertmanager receiver for visibility; a dedicated LibrePlay pager is NOT active yet (cross-tenant follow-up)."
        - alert: LibrePlaySLOErrorBudgetBurnMedium
          expr: |
            libreplay:slo_synth_avail:ratio6h < 0.94
            and
            libreplay:slo_synth_avail:ratio30m < 0.94
          for: 5m
          labels:
            severity: critical
            area: slo
            app: libreplay
            slo: synthetic-availability
            burnrate: medium
          annotations:
            summary: "LibrePlay SLO medium error-budget burn (LAN synthetic availability)"
            description: "Medium burn (6h and 30m availability both < 0.94, ~6x the 99% budget) for the LAN synthetic SLI. SLI is LAN-only (https://libreplay.lan.e-dani.com/api/health), not a public/edge signal. This alert routes today to the shared Synapse Alertmanager receiver for visibility; a dedicated LibrePlay pager is NOT active yet (cross-tenant follow-up)."
        - alert: LibrePlaySLOErrorBudgetBurnSlow
          expr: |
            libreplay:slo_synth_avail:ratio3d < 0.99
            and
            libreplay:slo_synth_avail:ratio6h < 0.99
          for: 15m
          labels:
            severity: warning
            area: slo
            app: libreplay
            slo: synthetic-availability
            burnrate: slow
          annotations:
            summary: "LibrePlay SLO slow error-budget burn (LAN synthetic availability)"
            description: "Slow/ticket-level burn (3d and 6h availability both < 0.99) for the LAN synthetic SLI; canonical successor to the 1h proxy. SLI is LAN-only (https://libreplay.lan.e-dani.com/api/health), not a public/edge signal. This alert routes today to the shared Synapse Alertmanager receiver for visibility; a dedicated LibrePlay pager is NOT active yet (cross-tenant follow-up)."
