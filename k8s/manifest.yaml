              value: "redis://libreplay:$(SHARED_VALKEY_LIBREPLAY_PASSWORD)@shared-valkey-master.databases.svc.cluster.local:6379/0"
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: AUTH_SECRET } }
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: MINIO_ACCESS_KEY } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: MINIO_SECRET_KEY } }
            - name: MEILISEARCH_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: MEILISEARCH_API_KEY } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: GOOGLE_CLIENT_ID, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: GOOGLE_CLIENT_SECRET, optional: true } }
            - name: FACEBOOK_CLIENT_ID
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: FACEBOOK_CLIENT_ID, optional: true } }
            - name: FACEBOOK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: FACEBOOK_CLIENT_SECRET, optional: true } }
            - name: OAUTH_TOKEN_ENC_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: OAUTH_TOKEN_ENC_KEY, optional: true } }
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_HOST, optional: true } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PORT, optional: true } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_USER, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PASSWORD, optional: true } }
            - name: METRICS_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: METRICS_BEARER_TOKEN, optional: true } }
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_KEY, optional: true } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_SECRET, optional: true } }
            - name: LIVE_STREAM_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVE_STREAM_SIGNING_KEY, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health/deps, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

