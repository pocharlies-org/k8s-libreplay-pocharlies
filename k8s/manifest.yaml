    metadata:
      labels: { app: libreplay-web }
      annotations:
        libreplay.e-dani.com/config-rollout: profile-interview-auth-faf51c26-20260713
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: libreplay-web }
      containers:
        - name: libreplay-web
          image: harbor.e-dani.com/homelab/libreplay-web:profile-interview-faf51c26@sha256:878cb28a15c56aa469f74def61b7fec7964f1b76635eeb13b0622a181657058b
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: libreplay-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: DATABASE_URL } }
            - name: SHARED_VALKEY_LIBREPLAY_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-shared-valkey, key: password } }
