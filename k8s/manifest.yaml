---
apiVersion: batch/v1
kind: Job
metadata:
  name: libreplay-db-init
  namespace: libreplay
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app: libreplay-db-init }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: db-init
          image: postgres:16-alpine
          env:
            - { name: DB_NAME, value: libreplay_lan }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: DB_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: DB_PASSWORD } }
          command: [sh, -lc]
          args:
            - |
              set -eu
              until pg_isready -h libreplay-postgres -U "${DB_USER}" >/dev/null 2>&1; do
                echo "waiting for Postgres"
                sleep 2
              done
              exists="$(psql -h libreplay-postgres -U "${DB_USER}" -d postgres -Atc "select 1 from pg_database where datname='${DB_NAME}'")"
              if [ "${exists}" != "1" ]; then
                createdb -h libreplay-postgres -U "${DB_USER}" "${DB_NAME}"
              fi
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
