apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreplay-livekit-egress
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-egress }
spec:
  replicas: 0
  selector:
    matchLabels: { app: libreplay-livekit-egress }
  template:
    metadata:
      labels: { app: libreplay-livekit-egress }
    spec:
      serviceAccountName: libreplay-livekit-egress
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 3600
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: libreplay-livekit-egress }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: libreplay-livekit-egress }
      containers:
        - name: egress
          image: livekit/egress:v1.13.0@sha256:980ff439431df2c773573721ab6da19e15bdc1f049ab7cb80e87470bf174c12f
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              cat >/tmp/egress.yaml <<EOF
              api_key: ${LIVEKIT_API_KEY}
              api_secret: ${LIVEKIT_API_SECRET}
              ws_url: ws://libreplay-livekit-server.libreplay-livekit.svc.cluster.local:7880
              redis:
                address: libreplay-livekit-redis.libreplay-livekit.svc.cluster.local:6379
                password: ${LIVEKIT_REDIS_PASSWORD}
              health_port: 7980
              prometheus_port: 9090
              logging:
                level: info
                json: true
              disallow_local_storage: true
              enable_chrome_sandbox: false
              storage:
                s3:
                  endpoint: ${LIVEKIT_S3_ENDPOINT}
                  region: ${LIVEKIT_S3_REGION}
                  bucket: ${LIVEKIT_S3_BUCKET}
                  access_key: ${LIVEKIT_S3_ACCESS_KEY}
                  secret: ${LIVEKIT_S3_SECRET_KEY}
                  force_path_style: true
              EOF
              exec /entrypoint.sh
          env:
            - { name: EGRESS_CONFIG_FILE, value: /tmp/egress.yaml }
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_API_KEY, optional: false } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_API_SECRET, optional: false } }
            - name: LIVEKIT_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_REDIS_PASSWORD, optional: false } }
            - name: LIVEKIT_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_S3_ENDPOINT, optional: false } }
            - name: LIVEKIT_S3_REGION
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_S3_REGION, optional: false } }
            - name: LIVEKIT_S3_BUCKET
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_S3_BUCKET, optional: false } }
            - name: LIVEKIT_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_S3_ACCESS_KEY, optional: false } }
            - name: LIVEKIT_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_S3_SECRET_KEY, optional: false } }
          ports:
            - { name: health, containerPort: 7980, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          startupProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "4", memory: 4Gi }
            limits: { cpu: "6", memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: egress-tmp, mountPath: /home/egress/tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: egress-tmp
          emptyDir: { sizeLimit: 10Gi }
