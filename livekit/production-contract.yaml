apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreplay-livekit-redis
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-redis }
spec:
  replicas: 0
  selector:
    matchLabels: { app: libreplay-livekit-redis }
  template:
    metadata:
      labels: { app: libreplay-livekit-redis }
    spec:
      serviceAccountName: libreplay-livekit-redis
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: libreplay-livekit-redis }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: libreplay-livekit-redis }
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - exec redis-server --appendonly yes --requirepass "$LIVEKIT_REDIS_PASSWORD"
          env:
            - name: LIVEKIT_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_REDIS_PASSWORD, optional: false } }
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_REDIS_PASSWORD, optional: false } }
          ports:
            - { name: redis, containerPort: 6379, protocol: TCP }
          startupProbe:
            exec: { command: ["/bin/sh", "-ec", "redis-cli ping | grep -qx PONG"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["/bin/sh", "-ec", "redis-cli ping | grep -qx PONG"] }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["/bin/sh", "-ec", "redis-cli ping | grep -qx PONG"] }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: redis-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: redis-data
          persistentVolumeClaim: { claimName: libreplay-livekit-redis-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: libreplay-livekit-redis-data
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-redis }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-redis
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-redis }
spec:
  selector: { app: libreplay-livekit-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreplay-livekit-server
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-server }
spec:
  replicas: 0
  selector:
    matchLabels: { app: libreplay-livekit-server }
  template:
    metadata:
      labels: { app: libreplay-livekit-server }
    spec:
      serviceAccountName: libreplay-livekit-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 18000
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: libreplay-livekit-server }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: libreplay-livekit-server }
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.9.1@sha256:c039a1bfa154c8479ac369c380665638e92a7e9531e69664549c0c0d3eb65e63
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat >/tmp/livekit.yaml <<EOF
              port: 7880
              bind_addresses: ["0.0.0.0"]
              rtc:
                tcp_port: 7881
                udp_port: 50000
                node_ip: 57.129.17.172
                use_external_ip: false
              redis:
                address: libreplay-livekit-redis.libreplay-livekit.svc.cluster.local:6379
                password: ${LIVEKIT_REDIS_PASSWORD}
              keys:
                ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
              prometheus_port: 6789
              room:
                auto_create: false
                empty_timeout: 600
                departure_timeout: 120
              ingress:
                rtmp_base_url: rtmp://ingest.livekit.e-dani.com/live
                whip_base_url: https://ingest.livekit.e-dani.com/w
              turn:
                enabled: true
                domain: turn.livekit.e-dani.com
                cert_file: /etc/livekit-turn-tls/tls.crt
                key_file: /etc/livekit-turn-tls/tls.key
                tls_port: 5349
                udp_port: 3478
              logging:
                level: info
                json: true
                sample: true
              EOF
              exec /livekit-server --config /tmp/livekit.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_API_KEY, optional: false } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_API_SECRET, optional: false } }
            - name: LIVEKIT_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-livekit-secrets, key: LIVEKIT_REDIS_PASSWORD, optional: false } }
          ports:
            - { name: http, containerPort: 7880, protocol: TCP }
            - { name: rtc-tcp, containerPort: 7881, protocol: TCP }
            - { name: rtc-udp, containerPort: 50000, protocol: UDP }
            - { name: turn-tls, containerPort: 5349, protocol: TCP }
            - { name: turn-udp, containerPort: 3478, protocol: UDP }
            - { name: metrics, containerPort: 6789, protocol: TCP }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { cpu: "4", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: turn-tls, mountPath: /etc/livekit-turn-tls, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: turn-tls
          secret:
            secretName: libreplay-livekit-turn-tls
            defaultMode: 0440
---
