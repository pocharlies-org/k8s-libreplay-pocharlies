---
apiVersion: v1
kind: Namespace
metadata:
  name: libreplay-livekit
  labels:
    app.kubernetes.io/name: libreplay-livekit
    app.kubernetes.io/part-of: libreplay
    libreplay.e-dani.com/environment: production
    libreplay.e-dani.com/activation: blocked-pending-provider-secrets-and-edge-signoff
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-livekit-secrets
  namespace: libreplay-livekit
  labels:
    app.kubernetes.io/name: libreplay-livekit
    libreplay.e-dani.com/environment: production
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: libreplay-livekit-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LIVEKIT_API_KEY
      remoteRef: { key: secret/libreplay/production, property: LIVEKIT_API_KEY }
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: secret/libreplay/production, property: LIVEKIT_API_SECRET }
    - secretKey: LIVEKIT_REDIS_PASSWORD
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_REDIS_PASSWORD }
    - secretKey: LIVEKIT_S3_ENDPOINT
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_S3_ENDPOINT }
    - secretKey: LIVEKIT_S3_REGION
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_S3_REGION }
    - secretKey: LIVEKIT_S3_BUCKET
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_S3_BUCKET }
    - secretKey: LIVEKIT_S3_ACCESS_KEY
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_S3_ACCESS_KEY }
    - secretKey: LIVEKIT_S3_SECRET_KEY
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_S3_SECRET_KEY }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-livekit-turn-tls
  namespace: libreplay-livekit
  labels:
    app.kubernetes.io/name: libreplay-livekit-server
    libreplay.e-dani.com/environment: production
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: libreplay-livekit-turn-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_TURN_TLS_CRT }
    - secretKey: tls.key
      remoteRef: { key: secret/libreplay/livekit-production, property: LIVEKIT_TURN_TLS_KEY }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-dns-preflight
  namespace: libreplay-livekit
  labels:
    app.kubernetes.io/name: libreplay-livekit
    libreplay.e-dani.com/environment: production
