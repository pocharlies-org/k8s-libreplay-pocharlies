kind: PodDisruptionBudget
metadata:
  name: libreplay-livekit-ingress
  namespace: libreplay-livekit
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: libreplay-livekit-ingress }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: libreplay-livekit-server
  namespace: libreplay-livekit
spec:
  selector:
    matchLabels: { app: libreplay-livekit-server }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: libreplay-livekit-egress
  namespace: libreplay-livekit
spec:
  selector:
    matchLabels: { app: libreplay-livekit-egress }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: libreplay-livekit-ingress
  namespace: libreplay-livekit
spec:
  selector:
    matchLabels: { app: libreplay-livekit-ingress }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
