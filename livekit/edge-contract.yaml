---
# Dormant edge contract. The traefik-edge controller does not currently watch
# this namespace or expose the dedicated media entrypoints listed in README.md.
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-rtc-tcp
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-server, libreplay.e-dani.com/edge-flow: rtc-tcp }
spec:
  selector: { app: libreplay-livekit-server }
  ports:
    - { name: rtc-tcp, port: 7881, targetPort: rtc-tcp, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-rtc-udp
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-server, libreplay.e-dani.com/edge-flow: rtc-udp }
spec:
  selector: { app: libreplay-livekit-server }
  ports:
    - { name: rtc-udp, port: 50000, targetPort: rtc-udp, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-turn-tls
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-server, libreplay.e-dani.com/edge-flow: turn-tls }
spec:
  selector: { app: libreplay-livekit-server }
  ports:
    - { name: turn-tls, port: 5349, targetPort: turn-tls, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-turn-udp
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-server, libreplay.e-dani.com/edge-flow: turn-udp }
spec:
  selector: { app: libreplay-livekit-server }
  ports:
    - { name: turn-udp, port: 3478, targetPort: turn-udp, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-rtmp
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-ingress, libreplay.e-dani.com/edge-flow: rtmp }
spec:
  selector: { app: libreplay-livekit-ingress }
  ports:
    - { name: rtmp, port: 1935, targetPort: rtmp, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-whip
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-ingress, libreplay.e-dani.com/edge-flow: whip }
spec:
  selector: { app: libreplay-livekit-ingress }
  ports:
    - { name: whip, port: 8080, targetPort: whip, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-livekit-whip-rtc
  namespace: libreplay-livekit
  labels: { app: libreplay-livekit-ingress, libreplay.e-dani.com/edge-flow: whip-rtc }
spec:
  selector: { app: libreplay-livekit-ingress }
  ports:
    - { name: whip-rtc, port: 7885, targetPort: whip-rtc, protocol: UDP }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: libreplay-livekit-signal
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
spec:
  ingressClassName: traefik-edge
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`livekit.e-dani.com`)
      services:
        - { name: libreplay-livekit-server, port: 7880 }
  tls:
    store: { name: default, namespace: traefik-edge }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: libreplay-livekit-whip
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
spec:
  ingressClassName: traefik-edge
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`ingest.livekit.e-dani.com`) && PathPrefix(`/w`)
      services:
        - { name: libreplay-livekit-whip, port: 8080 }
  tls:
    store: { name: default, namespace: traefik-edge }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: libreplay-livekit-rtc-tcp
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-rtc-tcp]
  routes:
    - match: HostSNI(`*`)
      services:
        - { name: libreplay-livekit-rtc-tcp, port: 7881 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: libreplay-livekit-turn-tls
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-turn-tls]
  routes:
    - match: HostSNI(`turn.livekit.e-dani.com`)
      services:
        - { name: libreplay-livekit-turn-tls, port: 5349 }
  tls:
    passthrough: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: libreplay-livekit-rtmp
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-rtmp]
  routes:
    - match: HostSNI(`*`)
      services:
        - { name: libreplay-livekit-rtmp, port: 1935 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: libreplay-livekit-rtc-udp
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-rtc-udp]
  routes:
    - services:
        - { name: libreplay-livekit-rtc-udp, port: 50000 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: libreplay-livekit-turn-udp
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-turn-udp]
  routes:
    - services:
        - { name: libreplay-livekit-turn-udp, port: 3478 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: libreplay-livekit-whip-rtc
  namespace: libreplay-livekit
  labels: { libreplay.e-dani.com/activation: blocked }
  annotations: { kubernetes.io/ingress.class: traefik-edge }
spec:
  entryPoints: [livekit-whip-rtc]
  routes:
    - services:
        - { name: libreplay-livekit-whip-rtc, port: 7885 }
