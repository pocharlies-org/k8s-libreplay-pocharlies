apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: libreplay-postgres
  namespace: libreplay
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_DB
              value: libreplay_staging
          readinessProbe:
            exec:
              command: [sh, -lc, 'pg_isready -U "$POSTGRES_USER" -d libreplay_staging']
---
apiVersion: batch/v1
kind: Job
metadata:
  name: libreplay-db-init
  namespace: libreplay
spec:
  template:
    spec:
      containers:
        - name: db-init
          env:
            - name: DB_NAME
              value: libreplay_staging
