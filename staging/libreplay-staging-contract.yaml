---
apiVersion: v1
kind: Namespace
metadata:
  name: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    app.kubernetes.io/part-of: libreplay
    libreplay.e-dani.com/environment: staging
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: infra/harbor/k8s-runtime-pull, property: dockerconfigjson }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-staging-dns-preflight
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
    libreplay.e-dani.com/purpose: dns-preflight
  annotations:
    external-dns.alpha.kubernetes.io/hostname: libreplay-staging.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  type: ExternalName
  externalName: staging-dns-placeholder.e-dani.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: libreplay-config
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
data:
  NODE_ENV: production
  DEPLOYMENT_MODE: staging
  APP_BASE_URL: https://libreplay-staging.e-dani.com
  AUTH_URL: https://libreplay-staging.e-dani.com
  AUTH_TRUST_HOST: "true"
  DEFAULT_LOCALE: es
  SUPPORTED_LOCALES: es,en,fr,de,pt
  RATE_LIMIT_DISABLED: "false"
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REDIS_PREFIX: libreplay:rl
  RATE_LIMIT_FAIL_MODE: closed
  RATE_LIMIT_TIMEOUT_MS: "250"
  TRUST_PROXY_CLIENT_IP: "true"
  TRUSTED_CLIENT_IP_HEADER: cf-connecting-ip
  AUTH_EMAIL_PROVIDER: smtp
  MAIL_FROM: LibrePlay <noreply@libreplay.e-dani.com>
  SMTP_SECURE: "true"
  ENABLE_LAN_DEMO_LOGIN: "false"
  LAN_DEMO_ALLOWED_HOSTS: ""
  LAN_DEMO_ALLOWED_CIDRS: ""
  USE_MOCK_OAUTH: "false"
  PAYMENT_PROVIDER: disabled
  ENABLE_MOCK_PAYMENTS: "false"
  ENABLE_MOCK_AGE_VERIFICATION: "false"
  ENABLE_MOCK_FACE_LIVENESS: "false"
  ENABLE_MOCK_CSAM_SCANNER: "false"
  ENABLE_MOCK_MEDIA_MODERATION: "false"
  ENABLE_MOCK_LLM: "false"
  LIVE_METERING_PROVIDER_RECONCILER_ENABLED: "true"
  LIVE_ADMISSION_RECONCILE_INTERVAL_MS: "15000"
  LIVE_ADMISSION_RECONCILE_BATCH_SIZE: "500"
  CUSTOM_REQUEST_EXPIRATION_INTERVAL_MS: "60000"
  CUSTOM_REQUEST_EXPIRATION_BATCH_SIZE: "100"
  MINIO_ENDPOINT: http://libreplay-minio.libreplay-staging.svc.cluster.local:9000
  MINIO_BUCKET: libreplay-media-staging
  MINIO_REGION: us-east-1
  MINIO_PUBLIC_URL: http://libreplay-minio.libreplay-staging.svc.cluster.local:9000
  MEILISEARCH_HOST: http://libreplay-meilisearch.libreplay-staging.svc.cluster.local:7700
