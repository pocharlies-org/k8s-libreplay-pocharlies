---
# Dormant until approved LibrePlay staging OAuth/SMTP provider evidence exists.
# Do not add this file to staging/kustomization.yaml or write the Vault path
# without passing scripts/check-libreplay-staging-secret-evidence.sh --strict.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-secrets
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: libreplay-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/libreplay/staging, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: secret/libreplay/staging, property: REDIS_URL }
    - secretKey: AUTH_SECRET
      remoteRef: { key: secret/libreplay/staging, property: AUTH_SECRET }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: secret/libreplay/staging, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: secret/libreplay/staging, property: MINIO_SECRET_KEY }
    - secretKey: MEILISEARCH_API_KEY
      remoteRef: { key: secret/libreplay/staging, property: MEILISEARCH_API_KEY }
    - secretKey: DB_USER
      remoteRef: { key: secret/libreplay/staging, property: DB_USER }
    - secretKey: DB_PASSWORD
      remoteRef: { key: secret/libreplay/staging, property: DB_PASSWORD }
    - secretKey: SEED_USER_PASSWORD
      remoteRef: { key: secret/libreplay/staging, property: SEED_USER_PASSWORD }
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: secret/libreplay/staging, property: GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: secret/libreplay/staging, property: GOOGLE_CLIENT_SECRET }
    - secretKey: FACEBOOK_CLIENT_ID
      remoteRef: { key: secret/libreplay/staging, property: FACEBOOK_CLIENT_ID }
    - secretKey: FACEBOOK_CLIENT_SECRET
      remoteRef: { key: secret/libreplay/staging, property: FACEBOOK_CLIENT_SECRET }
    - secretKey: OAUTH_TOKEN_ENC_KEY
      remoteRef: { key: secret/libreplay/staging, property: OAUTH_TOKEN_ENC_KEY }
    - secretKey: SMTP_HOST
      remoteRef: { key: secret/libreplay/staging, property: SMTP_HOST }
    - secretKey: SMTP_PORT
      remoteRef: { key: secret/libreplay/staging, property: SMTP_PORT }
    - secretKey: SMTP_USER
      remoteRef: { key: secret/libreplay/staging, property: SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: secret/libreplay/staging, property: SMTP_PASSWORD }
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef: { key: secret/libreplay/staging, property: METRICS_BEARER_TOKEN }
    - secretKey: LIVEKIT_API_KEY
      remoteRef: { key: secret/libreplay/staging, property: LIVEKIT_API_KEY }
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: secret/libreplay/staging, property: LIVEKIT_API_SECRET }
    - secretKey: LIVE_STREAM_SIGNING_KEY
      remoteRef: { key: secret/libreplay/staging, property: LIVE_STREAM_SIGNING_KEY }
