---
# Dormant until approved LibrePlay staging OAuth/SMTP provider evidence exists.
# Do not add this file to staging/kustomization.yaml or write the
# `libreplay-staging` 1Password item without passing
# scripts/check-libreplay-staging-secret-evidence.sh --strict.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-secrets
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
spec:
  refreshInterval: 6h
  secretStoreRef: { name: onepassword, kind: ClusterSecretStore }
  target:
    name: libreplay-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: libreplay-staging/DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: libreplay-staging/REDIS_URL }
    - secretKey: AUTH_SECRET
      remoteRef: { key: libreplay-staging/AUTH_SECRET }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: libreplay-staging/MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: libreplay-staging/MINIO_SECRET_KEY }
    - secretKey: MEILISEARCH_API_KEY
      remoteRef: { key: libreplay-staging/MEILISEARCH_API_KEY }
    - secretKey: DB_USER
      remoteRef: { key: libreplay-staging/DB_USER }
    - secretKey: DB_PASSWORD
      remoteRef: { key: libreplay-staging/DB_PASSWORD }
    - secretKey: SEED_USER_PASSWORD
      remoteRef: { key: libreplay-staging/SEED_USER_PASSWORD }
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: libreplay-staging/GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: libreplay-staging/GOOGLE_CLIENT_SECRET }
    - secretKey: FACEBOOK_CLIENT_ID
      remoteRef: { key: libreplay-staging/FACEBOOK_CLIENT_ID }
    - secretKey: FACEBOOK_CLIENT_SECRET
      remoteRef: { key: libreplay-staging/FACEBOOK_CLIENT_SECRET }
    - secretKey: OAUTH_TOKEN_ENC_KEY
      remoteRef: { key: libreplay-staging/OAUTH_TOKEN_ENC_KEY }
    - secretKey: SMTP_HOST
      remoteRef: { key: libreplay-staging/SMTP_HOST }
    - secretKey: SMTP_PORT
      remoteRef: { key: libreplay-staging/SMTP_PORT }
    - secretKey: SMTP_USER
      remoteRef: { key: libreplay-staging/SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: libreplay-staging/SMTP_PASSWORD }
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef: { key: libreplay-staging/METRICS_BEARER_TOKEN }
    - secretKey: LIVEKIT_API_KEY
      remoteRef: { key: libreplay-staging/LIVEKIT_API_KEY }
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: libreplay-staging/LIVEKIT_API_SECRET }
    - secretKey: LIVE_STREAM_SIGNING_KEY
      remoteRef: { key: libreplay-staging/LIVE_STREAM_SIGNING_KEY }
