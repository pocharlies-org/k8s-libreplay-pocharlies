apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: libreplay-staging
resources:
  - ../../../k8s
  - harbor-pull.externalsecret.yaml
  - cloudflare-ipallowlist.middleware.yaml

patches:
  - path: patch-namespace.json
    target:
      kind: Namespace
      name: libreplay
  - path: patch-external-secret.json
    target:
      kind: ExternalSecret
      name: libreplay-secrets
  - path: patch-configmap.yaml
  - path: patch-postgres-db.yaml
  - path: patch-required-provider-secrets.yaml
  - path: patch-staging-vmrule.json
    target:
      group: operator.victoriametrics.com
      version: v1beta1
      kind: VMRule
      name: libreplay-runtime
  - path: patch-remove-lan-synthetics-vmrule.json
    target:
      group: operator.victoriametrics.com
      version: v1beta1
      kind: VMRule
      name: libreplay-runtime
  - path: patch-disable-lan-dashboard.yaml
  - path: patch-delete-lan-vmprobe.yaml
    target:
      group: operator.victoriametrics.com
      version: v1beta1
      kind: VMProbe
      name: libreplay-lan-synthetic
  - path: patch-vmservicescrape.yaml
  - path: patch-ingressroute.json
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: libreplay-lan
  - path: patch-staging-job-annotations.yaml
