apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreplay-web
  namespace: libreplay
spec:
  template:
    spec:
      containers:
        - name: libreplay-web
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: GOOGLE_CLIENT_ID, optional: false } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: GOOGLE_CLIENT_SECRET, optional: false } }
            - name: FACEBOOK_CLIENT_ID
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: FACEBOOK_CLIENT_ID, optional: false } }
            - name: FACEBOOK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: FACEBOOK_CLIENT_SECRET, optional: false } }
            - name: OAUTH_TOKEN_ENC_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: OAUTH_TOKEN_ENC_KEY, optional: false } }
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_HOST, optional: false } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PORT, optional: false } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_USER, optional: false } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PASSWORD, optional: false } }
            - name: METRICS_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: METRICS_BEARER_TOKEN, optional: false } }
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_KEY, optional: false } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_SECRET, optional: false } }
            - name: LIVE_STREAM_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVE_STREAM_SIGNING_KEY, optional: false } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreplay-worker
  namespace: libreplay
spec:
  template:
    spec:
      containers:
        - name: libreplay-worker
          env:
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_HOST, optional: false } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PORT, optional: false } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_USER, optional: false } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: SMTP_PASSWORD, optional: false } }
            - name: LIVEKIT_API_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_KEY, optional: false } }
            - name: LIVEKIT_API_SECRET
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVEKIT_API_SECRET, optional: false } }
            - name: LIVE_STREAM_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: libreplay-secrets, key: LIVE_STREAM_SIGNING_KEY, optional: false } }
