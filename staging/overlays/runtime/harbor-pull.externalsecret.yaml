apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .registry }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: { key: infra/harbor/ci-robot, property: username }
    - secretKey: password
      remoteRef: { key: infra/harbor/ci-robot, property: password }
    - secretKey: registry
      remoteRef: { key: infra/harbor/ci-robot, property: registry }
