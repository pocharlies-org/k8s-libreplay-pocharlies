name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      run_node: false
      run_docker_build: false
      kustomize_paths: "k8s staging staging/overlays/runtime"
    secrets: inherit

  no-latest-images:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v7
      - name: Reject latest image tags
        run: |
          set -euo pipefail
          if grep -RInE 'image: .+:latest($|[[:space:]])' k8s staging; then
            echo "Kubernetes manifests must pin images by immutable tag and digest, never :latest." >&2
            exit 1
          fi
