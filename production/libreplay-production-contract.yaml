---
apiVersion: v1
kind: Namespace
metadata:
  name: libreplay-production
  labels:
    app.kubernetes.io/name: libreplay
    app.kubernetes.io/part-of: libreplay
    libreplay.e-dani.com/environment: production
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-secrets
  namespace: libreplay-production
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: production
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: libreplay-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: secret/libreplay/production, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: secret/libreplay/production, property: REDIS_URL }
    - secretKey: AUTH_SECRET
      remoteRef: { key: secret/libreplay/production, property: AUTH_SECRET }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: secret/libreplay/production, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: secret/libreplay/production, property: MINIO_SECRET_KEY }
    - secretKey: MEILISEARCH_API_KEY
      remoteRef: { key: secret/libreplay/production, property: MEILISEARCH_API_KEY }
    - secretKey: DB_USER
      remoteRef: { key: secret/libreplay/production, property: DB_USER }
    - secretKey: DB_PASSWORD
      remoteRef: { key: secret/libreplay/production, property: DB_PASSWORD }
    - secretKey: SEED_USER_PASSWORD
      remoteRef: { key: secret/libreplay/production, property: SEED_USER_PASSWORD }
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: secret/libreplay/production, property: GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: secret/libreplay/production, property: GOOGLE_CLIENT_SECRET }
    - secretKey: FACEBOOK_CLIENT_ID
      remoteRef: { key: secret/libreplay/production, property: FACEBOOK_CLIENT_ID }
    - secretKey: FACEBOOK_CLIENT_SECRET
      remoteRef: { key: secret/libreplay/production, property: FACEBOOK_CLIENT_SECRET }
    - secretKey: OAUTH_TOKEN_ENC_KEY
      remoteRef: { key: secret/libreplay/production, property: OAUTH_TOKEN_ENC_KEY }
    - secretKey: SMTP_HOST
      remoteRef: { key: secret/libreplay/production, property: SMTP_HOST }
    - secretKey: SMTP_PORT
      remoteRef: { key: secret/libreplay/production, property: SMTP_PORT }
    - secretKey: SMTP_USER
      remoteRef: { key: secret/libreplay/production, property: SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: secret/libreplay/production, property: SMTP_PASSWORD }
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef: { key: secret/libreplay/production, property: METRICS_BEARER_TOKEN }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: libreplay-production
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: production
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .registry }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: { key: infra/harbor/ci-robot, property: username }
    - secretKey: password
      remoteRef: { key: infra/harbor/ci-robot, property: password }
    - secretKey: registry
      remoteRef: { key: infra/harbor/ci-robot, property: registry }
---
apiVersion: v1
kind: Service
metadata:
  name: libreplay-production-dns-preflight
  namespace: libreplay-production
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: production
    libreplay.e-dani.com/purpose: dns-preflight
  annotations:
    external-dns.alpha.kubernetes.io/hostname: libreplay.e-dani.com
    external-dns.alpha.kubernetes.io/target: 57.129.17.172
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  type: ExternalName
  externalName: production-dns-placeholder.e-dani.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: libreplay-config
  namespace: libreplay-production
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: production
data:
  NODE_ENV: production
  DEPLOYMENT_MODE: production
  APP_BASE_URL: https://libreplay.e-dani.com
  AUTH_URL: https://libreplay.e-dani.com
  AUTH_TRUST_HOST: "true"
  DEFAULT_LOCALE: es
  SUPPORTED_LOCALES: es,en,fr,de,pt
  RATE_LIMIT_DISABLED: "false"
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_REDIS_PREFIX: libreplay:rl
  RATE_LIMIT_FAIL_MODE: closed
  RATE_LIMIT_TIMEOUT_MS: "250"
  TRUST_PROXY_CLIENT_IP: "true"
  TRUSTED_CLIENT_IP_HEADER: cf-connecting-ip
  AUTH_EMAIL_PROVIDER: smtp
  MAIL_FROM: LibrePlay <noreply@libreplay.e-dani.com>
  SMTP_SECURE: "true"
  ENABLE_LAN_DEMO_LOGIN: "false"
  LAN_DEMO_ALLOWED_HOSTS: ""
  LAN_DEMO_ALLOWED_CIDRS: ""
  USE_MOCK_OAUTH: "false"
  PAYMENT_PROVIDER: disabled
  ENABLE_MOCK_PAYMENTS: "false"
  ENABLE_MOCK_AGE_VERIFICATION: "false"
  ENABLE_MOCK_FACE_LIVENESS: "false"
  ENABLE_MOCK_CSAM_SCANNER: "false"
  ENABLE_MOCK_MEDIA_MODERATION: "false"
  ENABLE_MOCK_LLM: "false"
  MINIO_ENDPOINT: http://libreplay-minio.libreplay-production.svc.cluster.local:9000
  MINIO_BUCKET: libreplay-media-production
  MINIO_REGION: us-east-1
  MINIO_PUBLIC_URL: https://media.libreplay.e-dani.com
  MEILISEARCH_HOST: http://libreplay-meilisearch.libreplay-production.svc.cluster.local:7700
