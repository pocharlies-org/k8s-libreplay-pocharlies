---
# Contract-only artifact for PROD-DR-BACKUP-02.
# This file is intentionally not referenced by k8s/kustomization.yaml until the
# Vault path is populated and Security/PMO approve activation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-backup-secrets
  namespace: libreplay
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/purpose: backup-credentials
  annotations:
    libreplay.e-dani.com/activation: "manual-after-security-approval"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: libreplay-backup-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_BACKUP_ACCESS_KEY
      remoteRef:
        key: secret/libreplay/backup
        property: MINIO_BACKUP_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: MINIO_BACKUP_SECRET_KEY
      remoteRef:
        key: secret/libreplay/backup
        property: MINIO_BACKUP_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: PG_BACKUP_USER
      remoteRef:
        key: secret/libreplay/backup
        property: PG_BACKUP_USER
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: PG_BACKUP_PASSWORD
      remoteRef:
        key: secret/libreplay/backup
        property: PG_BACKUP_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
