---
# Contract-only artifact for PROD-MEDIA-PURGE-ORPHAN-02.
# This file is intentionally NOT referenced by k8s/kustomization.yaml (or any
# staging/production kustomization) until the Vault path is populated and
# Security/PMO approve activation. It materializes ONLY scoped, read-only
# identities for the recurring media orphan *inventory* (a read-only S3-to-DB
# reconciliation that never deletes). The application MinIO root credentials in
# Secret/libreplay-secrets must never be used by the inventory job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-media-orphan-secrets
  namespace: libreplay
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/purpose: media-orphan-inventory-credentials
  annotations:
    libreplay.e-dani.com/activation: "manual-after-security-approval"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: libreplay-media-orphan-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_ORPHAN_ACCESS_KEY
      remoteRef:
        key: secret/libreplay/media-orphan
        property: MINIO_ORPHAN_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: MINIO_ORPHAN_SECRET_KEY
      remoteRef:
        key: secret/libreplay/media-orphan
        property: MINIO_ORPHAN_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: PG_ORPHAN_DSN
      remoteRef:
        key: secret/libreplay/media-orphan
        property: PG_ORPHAN_DSN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
