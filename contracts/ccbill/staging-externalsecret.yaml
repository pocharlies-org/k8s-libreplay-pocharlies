# Dormant CCBill staging contract. Do not add this resource to an active
# kustomization until the source CCBill PR is released and every remote property
# exists with approved sandbox/UAT evidence. PAYMENT_PROVIDER must remain
# disabled until then.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libreplay-ccbill-secrets
  namespace: libreplay-staging
  labels:
    app.kubernetes.io/name: libreplay
    libreplay.e-dani.com/environment: staging
    libreplay.e-dani.com/provider: ccbill
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: libreplay-ccbill-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CCBILL_CLIENT_ACCNUM
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_CLIENT_ACCNUM }
    - secretKey: CCBILL_CLIENT_SUBACC
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_CLIENT_SUBACC }
    - secretKey: CCBILL_FLEX_ID
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_FLEX_ID }
    - secretKey: CCBILL_ENCRYPTION_KEY
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_ENCRYPTION_KEY }
    - secretKey: CCBILL_MERCHANT_APPLICATION_ID
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_MERCHANT_APPLICATION_ID }
    - secretKey: CCBILL_SECRET_KEY
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_SECRET_KEY }
    - secretKey: CCBILL_DATALINK_USERNAME
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_DATALINK_USERNAME }
    - secretKey: CCBILL_DATALINK_PASSWORD
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_DATALINK_PASSWORD }
    - secretKey: CCBILL_CORRELATION_SECRET
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_CORRELATION_SECRET }
    - secretKey: CCBILL_WEBHOOK_RAW_ENC_KEY
      remoteRef: { key: secret/libreplay/staging/ccbill, property: CCBILL_WEBHOOK_RAW_ENC_KEY }
